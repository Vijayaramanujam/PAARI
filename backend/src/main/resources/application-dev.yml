spring:
  datasource:
    url: jdbc:h2:file:./data/paari_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;NON_KEYWORDS=KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

paari:
  jwt:
    secret: "developmentSecretKeyForLocalTestingOnlyMakeItVeryLongToPassHS256Rules"
