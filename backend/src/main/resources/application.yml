server:
  port: ${PORT:10000}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: paari

  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/paari_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;NON_KEYWORDS=KEY,VALUE}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

paari:
  jwt:
    secret: ${JWT_SECRET:paariSecureProductionSecretKeyWithMoreThan256BitsLengthForHS256Algorithm2026}
    expirationMs: ${JWT_EXPIRATION_MS:86400000}

  matching:
    radiusKm: 15.0

  routing:
    ghApiKey: ${GH_API_KEY:}

  mail:
    fromAddress: ${MAIL_FROM_ADDRESS:noreply@paari.org}