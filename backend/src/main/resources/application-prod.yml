spring:
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/paari_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;NON_KEYWORDS=KEY,VALUE}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

paari:
  jwt:
    secret: ${JWT_SECRET:paariSecureProductionSecretKeyWithMoreThan256BitsLengthForHS256Algorithm2026}
    expirationMs: ${JWT_EXPIRATION_MS:86400000}

