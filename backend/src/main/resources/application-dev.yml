spring:
  datasource:
    url: jdbc:h2:mem:paari_db;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

paari:
  jwt:
    secret: "developmentSecretKeyForLocalTestingOnlyMakeItVeryLongToPassHS256Rules"
