server:
  port: ${PORT:10000}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: paari

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

paari:
  jwt:
    secret: ${JWT_SECRET:paariSecureProductionSecretKeyWithMoreThan256BitsLengthForHS256Algorithm2026}
    expirationMs: ${JWT_EXPIRATION_MS:86400000}

  matching:
    radiusKm: 15.0

  routing:
    ghApiKey: ${GH_API_KEY:}

  mail:
    fromAddress: ${MAIL_FROM_ADDRESS:noreply@paari.org}